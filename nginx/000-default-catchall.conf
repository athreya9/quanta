# Explicit default_server for this VPS.
#
# This box hosts multiple unrelated projects (quanta, arka-os/aarika, bastion,
# api). No single project's vhost should ever claim default_server - that
# makes it a silent catch-all for every other subdomain, including ones whose
# own vhost gets deleted or was never created. That's exactly what happened
# to aarika.virtusol.com: it fell through to quanta.virtusol.com.conf, which
# had claimed default_server.
#
# This block owns the catch-all slot instead and just closes the connection
# for any Host header that doesn't match a real vhost, so a misconfigured or
# missing vhost fails loudly (curl: connection reset) instead of silently
# serving the wrong project's content.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Reuses quanta's cert purely for TLS termination on this catch-all -
    # nobody should legitimately be hitting this block, so the CN mismatch
    # doesn't matter. Swap for a real self-signed cert if that bothers you.
    ssl_certificate /etc/letsencrypt/live/quanta.virtusol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quanta.virtusol.com/privkey.pem;

    return 444;
}
