# Nginx Reverse Proxy Configuration for QUANTA Intent Engine
# Domain: quanta.virtusol.com -> http://127.0.0.1:3002

server {
    server_name quanta.virtusol.com;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy to FastAPI Backend & Web App on Port 3002
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket / Real-time signal stream support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/quanta.virtusol.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/quanta.virtusol.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = quanta.virtusol.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name quanta.virtusol.com;
    return 404; # managed by Certbot
}
