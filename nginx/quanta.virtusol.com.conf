# Nginx Reverse Proxy Configuration for QUANTA Intent Engine
# Domain: quanta.virtusol.com -> http://127.0.0.1:3002

server {
    listen 80;
    server_name quanta.virtusol.com;

    # HTTPS Redirect (Certbot / Let's Encrypt ready)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name quanta.virtusol.com;

    # SSL Certificates (Uncomment once certbot is executed on VPS)
    # ssl_certificate /etc/letsencrypt/live/quanta.virtusol.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/quanta.virtusol.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to FastAPI Backend & Web App on Port 3002
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket / Real-time signal stream support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static Asset Caching
    location /assets/ {
        proxy_pass http://127.0.0.1:3002/assets/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
