<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="100%" height="100%">
  <defs>
    <linearGradient id="infinityCyanGradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="cyanGlowLogo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(10, 20)">
    <path d="M 90,60 C 115,25 150,25 165,60 C 180,95 150,95 90,60 C 65,25 30,25 15,60 C 0,95 30,95 90,60 Z"
          fill="none"
          stroke="url(#infinityCyanGradLogo)"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#cyanGlowLogo)" />
  </g>

  <text x="210" y="85" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="4">QUANTA</text>
  <text x="212" y="118" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#94A3B8" letter-spacing="3">REAL-TIME INTENT ENGINE</text>
</svg>
