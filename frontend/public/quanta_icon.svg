<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="100%" height="100%">
  <defs>
    <!-- Dual Gradient: Electric Blue (left) transitioning to Golden-Orange (right) -->
    <linearGradient id="blueToGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F7BFF" />
      <stop offset="40%" stop-color="#00D2FF" />
      <stop offset="65%" stop-color="#F5B544" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="infinityGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Continuous Smooth 3D-Styled Infinity Symbol (∞) -->
  <path d="M 100,60 C 125,25 160,25 175,60 C 190,95 160,95 100,60 C 75,25 40,25 25,60 C 10,95 40,95 100,60 Z"
        fill="none"
        stroke="url(#blueToGoldGrad)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#infinityGlow)" />
</svg>
