<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      background-color: #0B1020;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-img {
      width: 22px;
      height: 22px;
    }
    .logo-title {
      font-weight: 800;
      font-size: 14px;
      background: linear-gradient(135deg, #00F0FF 0%, #FF9900 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      color: #34D399;
    }
    .mode-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mode-production {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.6);
      color: #34D399;
    }
    .mode-demo {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #FBBF24;
    }
    .update-card {
      display: none;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .signal-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .signal-company {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #F8FAFC;
    }
    .signal-desc {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.45;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #00F0FF 0%, #2563EB 100%);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 10px;
      color: #64748B;
    }
    .reload-link {
      color: #00F0FF;
      cursor: pointer;
      text-decoration: none;
      font-weight: 600;
    }
    .reload-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-wrap">
      <img src="icon48.png" class="logo-img" alt="QUANTA Logo">
      <div class="logo-title">QUANTA INTENT</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span class="mode-pill mode-production" id="intent-mode-pill">PRODUCTION INTENT</span>
    </div>
  </div>

  <div class="update-card" id="update-banner">
    <div style="font-weight: 700; color: #00F0FF; margin-bottom: 4px;">🎉 New Extension Version Available!</div>
    <div style="color: #CBD5E1; margin-bottom: 8px;" id="update-msg">Version v1.2.0 ready for 1-click update.</div>
    <button class="btn" id="update-ext-btn" style="padding: 6px 10px; font-size: 11px;">⚡ 1-Click Update & Sync</button>
  </div>

  <div class="signal-card">
    <div class="signal-company" id="top-company">Checking Active Domain...</div>
    <div class="signal-desc" id="top-desc">Connecting to QUANTA Signal Engine at https://quanta.virtusol.com</div>
  </div>

  <button class="btn" id="trigger-test-btn">⚡ Dispatch Test Slack & Overlay Alert</button>

  <div class="footer-bar">
    <span id="ext-ver">v1.2.0</span>
    <span class="reload-link" id="force-reload-btn">⚡ 1-Click Reload Extension</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
